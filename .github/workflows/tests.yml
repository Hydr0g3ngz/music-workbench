name: tests
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[ui,benchmark,agent,dev]"
      - run: python scripts/check_public_docs.py
      - run: python -m ruff check .
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/ui_*.test.cjs
      - run: python -m build
